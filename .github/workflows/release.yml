name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Changesets 릴리스
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # 변경 기록(.changeset)이 있으면 "버전 업" PR을 열고, 그 PR이 머지되면 npm에 배포한다.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # changesets/action이 게시 출력에서 "New tag:" 줄을 찾지 못해 태그·GitHub Release를 만들지 않는다.
      # 그래서 직접 만든다. 위 단계가 성공했을 때만 돌고, 이미 있는 태그는 건너뛰므로 여러 번 돌아도 안전하다.
      # 버전은 "Version Packages" PR을 머지할 때만 바뀌므로, 태그가 없는 현재 버전은 방금 배포된 버전이다.
      - name: 태그와 GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            [ "$(jq -r '.private // false' "$dir/package.json")" = "true" ] && continue
            name=$(jq -r .name "$dir/package.json")
            version=$(jq -r .version "$dir/package.json")
            tag="$name@$version"
            if [ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "건너뜀(태그 있음): $tag"
              continue
            fi
            awk -v v="$version" '$0 == "## " v { f = 1; next } /^## / { f = 0 } f' "$dir/CHANGELOG.md" > notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
            echo "생성: $tag"
          done
